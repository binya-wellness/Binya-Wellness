services:
  - type: web
    name: KUMBAYA
    runtime: static
    repo: https://github.com/binya-wellness/Binya-Wellness
    branch: main
    buildCommand: >-
      rm -rf -- dist &&
      mkdir -p dist/northstar &&
      cp -- index.html services.html request.html privacy.html recovery.html
      how-services-work.html cyaam.html cyaam-wheel-worksheet.html northstar.html
      robots.txt sitemap.xml dist/ &&
      cp -- northstar/index.html northstar/help.html northstar/robots.txt dist/northstar/
    staticPublishPath: ./dist

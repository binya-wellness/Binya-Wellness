name: KUMBAYA launch verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'services.html'
      - 'privacy.html'
      - 'northstar/index.html'
      - 'tests/launch_smoke.py'
      - 'tests/launch_browser.cjs'
      - '.github/workflows/launch-verification.yml'
  workflow_dispatch:
jobs:
  source-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML links, IDs, labels, and inline JavaScript syntax
        run: python tests/launch_smoke.py source
  production-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployed website URLs and essential destinations (read-only)
        run: python tests/launch_smoke.py production
  browser-mobile-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned read-only browser test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium test browser
        run: npx playwright install chromium --with-deps
      - name: Run local-source and deployed mobile/desktop/accessibility tests
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kumbaya-site.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory northstar >/tmp/dostep-site.log 2>&1 &
          sleep 2
          set +e
          KUMBAYA_TEST_ORIGIN=http://127.0.0.1:8765 DOSTEP_TEST_ORIGIN=http://127.0.0.1:8766 node tests/launch_browser.cjs
          local_status=$?
          node tests/launch_browser.cjs
          deployed_status=$?
          if [ "$local_status" -ne 0 ] || [ "$deployed_status" -ne 0 ]; then exit 1; fi
      - name: Keep screenshots to diagnose failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kumbaya-browser-screenshots
          path: test-artifacts/
          retention-days: 7

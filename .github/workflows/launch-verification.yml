name: KUMBAYA launch verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'services.html'
      - 'privacy.html'
      - 'how-services-work.html'
      - 'request.html'
      - 'recovery.html'
      - 'cyaam.html'
      - 'cyaam-wheel-worksheet.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'northstar/robots.txt'
      - 'northstar/index.html'
      - 'northstar/help.html'
      - 'tests/launch_smoke.py'
      - 'tests/launch_browser.cjs'
      - 'tests/test_stripe_quote_catalog.py'
      - 'tests/test_customer_boundaries.py'
      - 'internal/stripe-live-price-registry.json'
      - '.github/workflows/launch-verification.yml'
  workflow_dispatch:
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate HTML links, IDs, labels, and inline JavaScript syntax
        run: python tests/launch_smoke.py source
      - name: Dry-run verified Stripe catalog and quote arithmetic
        run: python tests/test_stripe_quote_catalog.py
      - name: Verify nonclinical intake and portal safety boundaries
        run: python tests/test_customer_boundaries.py
  production-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check deployed website URLs and essential destinations (read-only)
        shell: bash
        run: |
          # Render may publish a new commit after GitHub starts this workflow.
          # Retry only public GET checks; never submit forms or use credentials.
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Public production check attempt $attempt of 8"
            if python tests/launch_smoke.py production; then exit 0; fi
            if [ "$attempt" -lt 8 ]; then sleep 15; fi
          done
          echo "Public pages did not become ready during bounded rollout checks."
          exit 1
  browser-mobile-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned read-only browser test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium test browser
        run: npx playwright install chromium --with-deps
      - name: Run local-source and deployed mobile/desktop/accessibility tests
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kumbaya-site.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory northstar >/tmp/dostep-site.log 2>&1 &
          sleep 2
          set +e
          KUMBAYA_TEST_ORIGIN=http://127.0.0.1:8765 DOSTEP_TEST_ORIGIN=http://127.0.0.1:8766 node tests/launch_browser.cjs
          local_status=$?
          node tests/launch_browser.cjs
          deployed_status=$?
          if [ "$local_status" -ne 0 ] || [ "$deployed_status" -ne 0 ]; then exit 1; fi
      - name: Keep screenshots to diagnose failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kumbaya-browser-screenshots
          path: test-artifacts/
          retention-days: 7
